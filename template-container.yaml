---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-sam-ecs-container
  title: AWS ECS Service Container
  description: |
    Create an AWS ECS service and container

    Options:
    * Container image
    * Container resources
    * Load balancing

  tags:
    - aws
    - ecs
    - container
    - containerization

spec:
  owner: developers
  type: component

  parameters:
    - title: ECS Service Info
      required:
        - namespace
        - name
        - description
        - owner
        - system
        - domain
        - environment
        - account_id
        - cluster
      properties:
        namespace:
          title: Namespace
          type: string
          description: Namespace for the component
          default: default
          ui:widget: hidden
        name:
          title: ECS Service Name
          type: string
          description: Unique name of the ECS service. Git repo will be named ${name}-app
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Short description of the component
        owner:
          title: Owner
          type: string
          description: |
            Owning group of entity.
          ui:field: MyGroupsPicker
          ui:options:
            allowArbitraryValues: false
        domain:
          title: Domain
          type: string
          description: Domain the component belongs to.
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Domain
        system:
          title: System
          type: string
          description: System the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
                relations.partOf: "{{ parameters.domain }}"
        environment:
          title: Environment
          type: string
          description: Environment the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                relations.partOf: "{{ parameters.system }}"
                spec.type: environment
        account_id:
          title: Account ID
          type: string
          description: Cloud account to deploy to
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                relations.dependencyOf: "{{ parameters.environment }}"
                spec.type: cloud-account
        cluster:
          title: Cluster
          type: string
          description: ECS cluster to deploy to
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Component
                relations.partOf: "{{ parameters.system }}"
                spec.type: container-cluster
    - title: Container Configuration
      required:
        - container_image
        - container_tag
        - container_cpu
        - container_memory
        - container_count
      properties:
        container_image:
          title: Container Image
          type: string
          description: Container image name
        container_tag:
          title: Container Tag
          type: string
          description: Container image tag
          default: latest
        container_cpu:
          title: Container CPU shares
          type: number
          description: Container CPU shares; 1 CPU = 1024
          default: 1024
        container_memory:
          title: Container Memory
          type: number
          description: Amount of container memory in MB
          default: 2048
        container_count:
          title: Container Count
          type: number
          description: Number of container instances; most production services should have one per AZ (typically 3)
          default: 3
    - title: Infrastructure Configuration
      required:
        - use_load_balancer
        - enable_datadog
      properties:
        enable_datadog:
          title: Enable Datadog integration?
          type: boolean
          description: Whether to enable Datadog monitoring for the ECS task containers
          default: true
          'ui:widget': 'radio'
        use_load_balancer:
          title: Use cluster load balancer?
          type: boolean
          description: Whether to create a load balancer rule to direct traffic to the task containers
          default: true
          'ui:widget': 'radio'
      dependencies:
        use_load_balancer:
          allOf:
            - if:
                properties:
                  use_load_balancer:
                    const: true
              then:
                required:
                  - container_port
                  - load_balancer_path
                  - load_balancer_priority
                properties:
                  container_port:
                    title: Container port
                    type: number
                    description: Container network port; required if using load balancer
                  load_balancer_path:
                    title: Load balancer path
                    type: string
                    description: Path for the load balancer rule; eg. '/app/*' (all paths prefixed with /app), '*' (all paths)
                    default: '*'
                  load_balancer_priority:
                    title: Load balancer rule priority
                    type: number
                    description: Lower values are evaluated first.
                    default: 1

  steps:
    - id: fetch
      name: Fetch Entity References
      action: catalog:fetch
      input:
        entityRefs:
          - ${{ parameters.owner }}
          - ${{ parameters.domain }}
          - ${{ parameters.system }}
          - ${{ parameters.account_id }}
          - ${{ parameters.cluster }}

    - id: cluster
      name: Create Container
      action: fetch:template
      input:
        targetPath: container
        url: ./container/skeleton
        values:
          component_namespace: ${{ parameters.namespace }}
          domain_title: ${{ steps.fetch.output.entities[1].metadata.title }}
          domain_name: ${{ parameters.domain | parseEntityRef | pick('name') }}
          system_entity: ${{ parameters.system }}
          system_title: ${{ steps.fetch.output.entities[2].metadata.title }}
          system_name: ${{ parameters.system | parseEntityRef | pick('name') }}
          component_prefix: ${{ parameters.name | lower }}
          component_name: ${{ parameters.name | lower }}-app
          component_description: ${{ parameters.description }}
          account_entity: ${{ parameters.account_id }}
          owner: ${{ parameters.owner }}
          cluster_ref: ${{ parameters.cluster }}
          cluster_domain_name: ${{ parameters.domain | parseEntityRef | pick('name') }}
          cluster_system_name: ${{ parameters.system | parseEntityRef | pick('name') }}
          cluster_component_name: ${{ parameters.cluster | parseEntityRef | pick('name')}}
          container_image: ${{ parameters.container_image }}
          container_tag: ${{ parameters.container_tag }}
          container_cpu: ${{ parameters.container_cpu }}
          container_memory: ${{ parameters.container_memory }}
          container_count: ${{ parameters.container_count }}
          container_port: ${{ parameters.container_port }}
          use_load_balancer: ${{ parameters.use_load_balancer }}
          load_balancer_path: ${{ parameters.load_balancer_path }}
          load_balancer_priority: ${{ parameters.load_balancer_priority }}
          enable_datadog: ${{ parameters.enable_datadog }}

    - id: cluster-pipeline
      name: Create container pipeline
      action: fetch:template
      input:
        targetPath: container
        url: ./container/pipeline

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        sourcePath: container
        repoUrl: github.com?repo=${{ parameters.name | lower }}-app&owner=ServerlessOpsIO
        repoVisibility: public
        protectDefaultBranch: false
        requiredApprovingReviewCount: 0
        description: ${{ parameters.description }}
        gitAuthorName: ${{ user.entity.spec.profile.displayName }}
        gitAuthorEmail:  ${{ user.entity.spec.profile.email }}
        gitCommitMessage: "Initial commit via Backstage"
        defaultBranch: main
        secrets:
          DEPLOYMENT_ACCOUNT_ID: ${{ steps.fetch.output.entities[3].metadata.title }}
        customProperties:
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          domain: ${{ parameters.domain | parseEntityRef | pick('name') }}
          owner: ${{ parameters.owner | parseEntityRef | pick('name') }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"
